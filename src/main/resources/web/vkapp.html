<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vkbot — ключ доступа</title>
<style>
  body{margin:0;padding:28px 20px;font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#1c1f24}
  @media (prefers-color-scheme:dark){body{background:#19191a;color:#e1e3e6}}
  h2{font-size:19px;margin:0 0 10px}
  .muted{color:#818c99;font-size:14px}
  button{font:inherit;border:0;border-radius:8px;padding:9px 16px;background:#2688eb;color:#fff;font-weight:600;cursor:pointer;margin:12px 8px 0 0}
  button.sec{background:#e5ebf1;color:#2688eb}
  textarea{width:100%;box-sizing:border-box;margin-top:10px;font:12px monospace;min-height:70px;display:none}
  .ok{color:#4bb34b}.err{color:#e64646}
</style>
</head>
<body>
<h2 id="title">Ключ доступа для vkbot</h2>
<div id="msg" class="muted">Запрашиваю у VK ключ с правом «доступ к сообществам» (groups)…</div>
<button id="retry" style="display:none">Запросить ключ ещё раз</button>
<button id="copy" class="sec" style="display:none">Скопировать ключ</button>
<textarea id="token" readonly></textarea>
<script src="/vk-bridge.min.js"></script>
<script>
"use strict";
// Мини-приложение VK: по документации VKWebAppGetAuthToken выдаёт ключ пользователя с правом groups,
// которое нужно board.getTopics / board.getComments для закрытых и частных сообществ.
// Адрес этой страницы должен совпадать с адресом в настройках мини-приложения (http://localhost:ПОРТ/vkapp).
var params = new URLSearchParams(location.search);
var appId = Number(params.get("vk_app_id"));
var api = location.hostname === "localhost" || location.hostname === "127.0.0.1"
  ? "/api/auth" : "http://localhost:" + (params.get("port") || "8765") + "/api/auth";
var $ = function (id) { return document.getElementById(id); };
var token = null, expires = 0;

function say(text, cls) { var m = $("msg"); m.textContent = text; m.className = cls || "muted"; }

function deliver() {
  // передаём ключ программе в формате адреса VK: #access_token=…&expires_in=…
  var expiresIn = expires ? Math.max(0, expires - Math.floor(Date.now() / 1000)) : 0;
  return fetch(api, {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({input: "#access_token=" + encodeURIComponent(token) + "&expires_in=" + expiresIn})})
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.error) throw new Error(j.error);
      say("Готово! Ключ передан в программу (" + j.text + "). Вернитесь на вкладку vkbot — это окно можно закрыть.", "ok");
      try { new BroadcastChannel("vkbot").postMessage("auth"); } catch (e) {}
    });
}

function request() {
  $("retry").style.display = "none";
  if (!appId) { say("Откройте эту страницу как мини-приложение: https://vk.com/app<ID приложения>.", "err"); return; }
  say("Запрашиваю у VK ключ с правом «доступ к сообществам» (groups)…");
  vkBridge.send("VKWebAppGetAuthToken", {app_id: appId, scope: "groups"})
    .then(function (data) {
      token = data.access_token; expires = data.expires || 0;
      if ((data.scope || "").split(",").indexOf("groups") < 0) {
        say("VK выдал ключ без права groups (выдано: " + (data.scope || "ничего") + "). Обсуждения закрытых сообществ читаться не будут.", "err");
      }
      $("token").value = token;
      return deliver().catch(function (e) {
        // программа недоступна из фрейма (не запущена, другой порт или браузер блокирует localhost) — даём скопировать
        say("Ключ получен, но передать его в программу не удалось (" + e.message + "). Скопируйте ключ и вставьте его в поле на странице vkbot.", "err");
        $("token").style.display = "block"; $("copy").style.display = "";
      });
    })
    .catch(function (e) {
      var d = e && e.error_data ? (e.error_data.error_reason || e.error_data.error_msg || JSON.stringify(e.error_data)) : String(e);
      say("VK не выдал ключ: " + d, "err");
      $("retry").style.display = "";
    });
}

$("retry").onclick = request;
$("copy").onclick = function () {
  $("token").select();
  (navigator.clipboard ? navigator.clipboard.writeText(token) : Promise.reject())
    .then(function () { $("copy").textContent = "Скопировано"; })
    .catch(function () { document.execCommand("copy"); $("copy").textContent = "Скопировано"; });
};

vkBridge.send("VKWebAppInit").finally(request);
</script>
</body>
</html>
