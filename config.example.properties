# =====================================================================
#  Настройки vkbot — статистика по обсуждениям сообщества VK
#  Файл в кодировке UTF-8. Строки, начинающиеся с #, — комментарии.
# =====================================================================

# ---------- Доступ к VK (обязательно) ----------

# Файл config.properties НЕОБЯЗАТЕЛЕН: без него ключ VK просто вставляется на странице при запуске.
#
# Способ авторизации:
#   vkapp — ключ вводится на странице (вставить ключ vk1.a.… или адрес из браузера).
#           Если задан vkapp.client_id, на странице появится кнопка «Получить ключ в VK».
#   vkid  — вход через VK ID (нужно приложение на id.vk.com): один раз login.bat, дальше всё само.
#   token — постоянный ключ прямо в этом файле, в vk.access_token.
# Ключ сообщества (из «Управление → Работа с API») для обсуждений НЕ подходит.
vk.auth=vkapp

# --- для vk.auth=vkapp ---
# ID приложения (мини-приложения) с dev.vk.com — необязательно, только для кнопки «Получить ключ в VK»
vkapp.client_id=
# Куда VK вернёт ключ. По умолчанию — https://oauth.vk.com/blank.html (адрес нужно будет вставить в консоль).
# Если VK разрешит http://localhost:8765/callback (добавьте его в доверенные адреса приложения),
# ключ будет забираться автоматически, без вставки.
#vkapp.redirect_uri=http://localhost:8765/callback
# Права. Пусто — без дополнительных прав (для мини-приложений offline/groups VK не даёт)
vkapp.scope=
# Где хранится полученный ключ (до истечения срока)
vkapp.token_cache=vk-token-cache.properties

# --- для vk.auth=vkid (см. README.md) ---
vkid.client_id=
vkid.redirect_uri=http://localhost:8765/callback
vkid.scope=
vkid.token_file=vkid-token.properties

# --- для vk.auth=token ---
vk.access_token=

# Сообщества, их периоды и делитель задаются в интерфейсе (хранятся в communities.json).
# vk.group_id нужен только для консольного режима (--cli).
#vk.group_id=my_club

# Версия VK API
vk.api_version=5.199

# Пауза между запросами, мс (VK разрешает ~3 запроса в секунду)
vk.request_delay_ms=350
# Сколько раз повторять запрос при временных/сетевых ошибках
vk.max_retries=5

# ---------- Интерфейс ----------

# Порт локальной страницы http://localhost:8765
ui.port=8765
ui.open_browser=true

# ---------- Бонусные баллы ----------

# Строка в начале сообщения, после которой текст считается с множителем (регулярное выражение)
bonus.marker_regex=Бонусные\\s+баллы\\s*:
bonus.multiplier=2
# Делитель по умолчанию (в интерфейсе можно поменять)
bonus.divisor=500

# Первая строка сообщения, при которой оно целиком исключается из статистики (регулярное выражение)
skip.marker_regex=не\\s+считать

# ---------- Период (только консольный режим --cli; в интерфейсе — календарь) ----------

# По умолчанию — последние N дней до момента запуска
period.days=7
# Либо явные границы (ГГГГ-ММ-ДД или ГГГГ-ММ-ДД ЧЧ:ММ). period.to по дате включается целиком.
#period.from=2026-11-02
#period.to=2026-11-08
timezone=Europe/Moscow

# ---------- Какие обсуждения смотреть ----------

# Только эти темы (id через запятую). Пусто — все.
topics.only_ids=
# Исключить темы (например, флудилку)
topics.exclude_ids=
# Если одну тему прочитать не удалось — пропустить её и продолжить (true) или остановиться (false)
topics.skip_on_error=true

# ---------- Подсчёт символов ----------

# Убирать разметку ответов VK вида [id123:bp-1_2|Имя] -> Имя
text.strip_reply_mentions=true
# Пробелы, переносы строк и невидимые символы при подсчёте символов не учитываются никогда.

# ---------- Показатели ----------

# Колонки отчёта по порядку. Встроенные:
#   posts        — количество сообщений
#   chars        — символов всего
#   avg_chars    — среднее символов в сообщении
#   max_chars    — самое длинное сообщение
#   topics       — в скольких обсуждениях писал
#   attachments  — количество вложений
#   likes        — полученные лайки
#   bonus_posts  — сколько сообщений со строкой «Бонусные баллы»
#   weighted_chars — символы с учётом ×2 для бонусного текста
#   bonus_points — бонусные баллы = weighted_chars / делитель
metrics=posts,bonus_posts,chars,weighted_chars,bonus_points

# Собственные показатели без программирования — поиск по тексту регулярным выражением.
#   metric.<ключ>.type      = regex
#   metric.<ключ>.title     = заголовок колонки
#   metric.<ключ>.pattern   = регулярное выражение (Java); значение берётся из 1-й группы (...)
#   metric.<ключ>.aggregate = count | sum | avg | min | max | list | distinct
#   metric.<ключ>.per_post  = показывать ли значение у каждого сообщения (true)
#   metric.<ключ>.ignore_case = true
# Обратная косая черта в .properties пишется удвоенной: \\d, \\s.
#
# Пример: сообщения вида «Часов: 3,5» — суммируем часы по автору
#metric.hours.type=regex
#metric.hours.title=Часы
#metric.hours.pattern=Часов:\\s*(\\d+(?:[.,]\\d+)?)
#metric.hours.aggregate=sum
#
# Пример: какие хэштеги использовал автор
#metric.tags.type=regex
#metric.tags.title=Хэштеги
#metric.tags.pattern=(#[\\p{L}\\d_]+)
#metric.tags.aggregate=distinct

# ---------- Отчёт ----------

report.dir=reports
report.open_in_browser=true
# Подробный список сообщений каждого автора
report.include_posts=true
report.preview_length=150

# ---------- Лог ----------

# INFO | DEBUG (подробно, со стеком ошибок) | WARNING | ERROR
log.level=INFO
# Файл лога (дублирует консоль, всегда со стеком ошибок). none — не писать.
log.file=logs/vkbot.log
